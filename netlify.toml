# Lead Desk - Netlify config
[build]
  publish = "app"
  command = "echo 'static site, nothing to build'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Netlify shows these as boxes on the "Deploy to Netlify" screen.
# The text is a hint, not a default: type your own values.
[template.environment]
  ADMIN_PASSWORD = "Choose a long password, 12 or more characters. You sign in to /admin with it."
  BUSINESS_NAME = "Your business name, shown on the sign-in screen"

# The embed script is loaded from other websites.
[[headers]]
  for = "/leaddesk.js"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Resource-Policy = "cross-origin"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
