<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lead Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/ui.css">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<style>
  html, body { height: 100%; }
  body { overflow: hidden; }
  .shell { display: grid; grid-template-columns: 260px 1fr; height: 100vh; height: 100dvh; }

  /* ---- sidebar ---- */
  .side { display: flex; flex-direction: column; min-height: 0; background: var(--side); border-right: 1px solid var(--line); }
  .ws { position: relative; padding: 14px 12px 10px; }
  .ws-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; border: 0; border-radius: var(--radius); background: none; cursor: pointer; text-align: left; }
  .ws-btn:hover { background: var(--hover); }
  .ws-logo { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; font-weight: 600; font-size: 13px; color: #fff; background: var(--primary); flex: none; }
  .ws-name { flex: 1; min-width: 0; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ws-btn svg { width: 16px; height: 16px; color: var(--ink-3); flex: none; }
  .menu { position: absolute; z-index: 30; min-width: 220px; padding: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow-pop); }
  .menu[hidden] { display: none; }
  .menu .mi { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border: 0; border-radius: 5px; background: none; cursor: pointer; text-align: left; font-size: 14px; text-decoration: none; color: var(--ink); }
  .menu .mi:hover, .menu .mi:focus-visible { background: var(--hover); outline: none; }
  .menu .mi svg { width: 16px; height: 16px; color: var(--ink-2); }
  .menu .sep { height: 1px; margin: 6px 4px; background: var(--line-soft); }
  .menu .meta { padding: 6px 10px 8px; font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; }
  .ws .menu { left: 12px; right: 12px; top: 54px; }

  .nav { flex: 1; overflow-y: auto; padding: 4px 12px 12px; }
  .nav-h { margin: 18px 8px 6px; font-size: 13px; font-weight: 500; color: var(--ink-3); }
  .nav a { display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 10px; border-radius: var(--radius); color: var(--ink); text-decoration: none; font-size: 14.5px; }
  .nav a:hover { background: var(--hover); }
  .nav a[aria-current="page"] { background: var(--active); font-weight: 500; }
  .nav a svg { width: 18px; height: 18px; color: var(--ink-2); flex: none; }
  .nav .badge { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--primary); color: #fff; font-size: 11.5px; font-weight: 600; display: grid; place-items: center; }

  .gs { margin: 0 12px 10px; padding: 14px 14px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
  .gs-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; width: 100%; padding: 0; border: 0; background: none; cursor: pointer; text-align: left; }
  .gs-h b { display: block; font-weight: 500; font-size: 14px; }
  .gs-h span { font-size: 12.5px; color: var(--ink-2); }
  .gs-h svg { width: 16px; height: 16px; color: var(--ink-3); margin-top: 2px; transition: transform .15s; }
  .gs[data-open="false"] .gs-h svg { transform: rotate(-90deg); }
  .gs-bar { height: 3px; margin: 10px 0 6px; border-radius: 2px; background: var(--line-soft); overflow: hidden; }
  .gs-bar i { display: block; height: 100%; background: var(--primary); border-radius: 2px; transition: width .3s; }
  .gs ol { list-style: none; margin: 6px 0 0; padding: 0; }
  .gs[data-open="false"] ol { display: none; }
  .gs li a, .gs li span.t { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13.5px; text-decoration: none; color: var(--ink); }
  .gs li a:hover { text-decoration: underline; }
  .gs .dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid #c9ced5; flex: none; display: grid; place-items: center; }
  .gs li.done .dot { background: var(--primary); border-color: var(--primary); }
  .gs li.done .dot svg { width: 11px; height: 11px; color: #fff; }
  .gs li.done .t, .gs li.done a { color: var(--ink-3); text-decoration: line-through; }

  .side-foot { display: flex; align-items: center; gap: 6px; padding: 10px 12px 14px; }
  .side-foot .btn-icon { width: 34px; min-height: 34px; border-radius: 50%; }
  .side-foot .grow { flex: 1; }

  /* ---- main ---- */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .demo-bar { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; padding: 9px 16px; background: #fff8e1; border-bottom: 1px solid #f1e3b5; font-size: 13.5px; color: #5c4600; text-align: center; }
  .demo-bar a { font-weight: 600; }
  .top { display: flex; align-items: center; gap: 12px; min-height: 72px; padding: 14px 32px 14px 48px; border-bottom: 1px solid var(--line); }
  .top h1 { margin: 0; font-size: 17px; font-weight: 600; flex: 1; min-width: 0; }
  .top .actions { display: flex; align-items: center; gap: 10px; }
  .top .sepv { width: 1px; height: 24px; background: var(--line); }
  .menu-btn { display: none; }
  .scroll { flex: 1; overflow-y: auto; min-height: 0; }
  .page { padding: 0 32px 48px 48px; }
  .page-pad { padding-top: 28px; }

  .search { position: relative; }
  .search input { width: 220px; padding-left: 34px; min-height: 36px; }
  .search svg { position: absolute; left: 11px; top: 10px; width: 16px; height: 16px; color: var(--ink-3); pointer-events: none; }
  .drop { position: relative; }
  .drop .menu { right: 0; top: calc(100% + 6px); }
  .mi[aria-checked="true"]::after { content: "✓"; margin-left: auto; color: var(--ink-2); }

  /* ---- table ---- */
  .tbl { width: 100%; border-collapse: collapse; }
  .tbl th { text-align: left; font-weight: 400; color: var(--ink-2); font-size: 14px; padding: 22px 12px 12px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
  .tbl td { padding: 14px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  .tbl tbody tr { cursor: pointer; }
  .tbl tbody tr:hover td { background: #fafbfc; }
  .tbl tbody tr.sel td { background: #f5f7fa; }
  .tbl .who { display: flex; align-items: center; gap: 12px; min-width: 200px; }
  .tbl .who b { display: block; font-weight: 500; font-size: 14.5px; }
  .tbl .who small { display: block; color: var(--ink-2); font-size: 13px; }
  .tbl .num { font-variant-numeric: tabular-nums; }
  .tbl .muted { color: var(--ink-2); }
  .tbl td.more { width: 48px; text-align: right; }
  .tbl .rowbtn { width: 32px; height: 32px; border: 0; border-radius: 6px; background: none; cursor: pointer; color: var(--ink-2); display: inline-grid; place-items: center; }
  .tbl .rowbtn:hover { background: var(--active); color: var(--ink); }
  .tbl .rowbtn svg { width: 18px; height: 18px; }
  @media (max-width: 1100px) { .tbl .c-src, .tbl .c-phone { display: none; } }

  .empty { display: grid; justify-items: center; gap: 10px; padding: 72px 24px; text-align: center; }
  .empty .ic { width: 48px; height: 48px; border-radius: 12px; background: var(--side); border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink-2); }
  .empty .ic svg { width: 22px; height: 22px; }
  .empty h3 { margin: 6px 0 0; font-size: 16px; font-weight: 600; }
  .empty p { margin: 0 0 8px; color: var(--ink-2); max-width: 380px; }

  /* ---- board ---- */
  .board { display: grid; grid-template-columns: repeat(6, minmax(220px, 1fr)); gap: 14px; padding-top: 22px; overflow-x: auto; padding-bottom: 8px; }
  .col { background: var(--side); border: 1px solid var(--line-soft); border-radius: 10px; padding: 10px; min-height: 240px; }
  .col.over { border-color: var(--focus); background: #f3f6fd; }
  .col-h { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 10px; }
  .col-h span { color: var(--ink-3); font-size: 13px; }
  .bcard { display: block; width: 100%; text-align: left; margin-bottom: 8px; padding: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; cursor: grab; }
  .bcard:hover { border-color: #cdd2d8; }
  .bcard b { display: block; font-weight: 500; }
  .bcard small { display: block; color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }
  .bcard .row { display: flex; justify-content: space-between; margin-top: 10px; font-size: 12.5px; color: var(--ink-2); }
  .bcard .row b { font-weight: 600; color: var(--ink); display: inline; }

  /* ---- overview ---- */
  .hello { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  .hello h2 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
  .hello p { margin: 4px 0 0; color: var(--ink-2); }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px; }
  .tile { padding: 18px 20px; }
  .tile .k { color: var(--ink-2); font-size: 13.5px; }
  .tile .v { margin-top: 6px; font-size: 26px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .tile .s { margin-top: 2px; color: var(--ink-3); font-size: 13px; }
  .grid2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; }
  .chart { display: grid; grid-template-columns: repeat(14, 1fr); align-items: end; gap: 8px; height: 180px; padding: 8px 4px 0; }
  .chart .b { position: relative; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
  .chart .b i { display: block; min-height: 2px; border-radius: 4px 4px 1px 1px; background: var(--primary); opacity: .9; }
  .chart .b.zero i { background: var(--line); }
  .chart .b em { position: absolute; left: 0; right: 0; top: -18px; text-align: center; font-style: normal; font-size: 11px; color: var(--ink-2); }
  .chart-x { display: grid; grid-template-columns: repeat(14, 1fr); gap: 8px; padding: 8px 4px 0; font-size: 11.5px; color: var(--ink-3); text-align: center; }
  .rl { list-style: none; margin: 0; padding: 0; }
  .rl li a { display: flex; align-items: center; gap: 12px; padding: 11px 20px; text-decoration: none; border-top: 1px solid var(--line-soft); }
  .rl li:first-child a { border-top: 0; }
  .rl li a:hover { background: #fafbfc; }
  .rl .nm { flex: 1; min-width: 0; }
  .rl .nm b { display: block; font-weight: 500; }
  .rl .nm small { color: var(--ink-2); font-size: 12.5px; }
  .rl .when { color: var(--ink-3); font-size: 12.5px; text-align: right; }
  .srcs { display: grid; gap: 12px; }
  .src-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13.5px; }
  .src-row .track { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--line-soft); overflow: hidden; }
  .src-row .track i { display: block; height: 100%; background: #5b6b7f; border-radius: 3px; }
  @media (max-width: 1180px) { .tiles { grid-template-columns: repeat(2, 1fr); } .grid2 { grid-template-columns: 1fr; } }

  /* ---- drawer ---- */
  .scrim { position: fixed; inset: 0; background: rgba(20, 26, 34, .18); z-index: 40; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); z-index: 41; display: flex; flex-direction: column; background: var(--bg); border-left: 1px solid var(--line); box-shadow: -12px 0 40px rgba(20, 26, 34, .10); animation: slide .18s ease-out; }
  @keyframes slide { from { transform: translateX(24px); opacity: .6; } }
  .scrim[hidden], .drawer[hidden] { display: none; }
  .dr-h { display: flex; align-items: center; gap: 14px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
  .dr-h .avatar { width: 40px; height: 40px; font-size: 14px; }
  .dr-h h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .dr-h p { margin: 2px 0 0; color: var(--ink-2); font-size: 13px; }
  .dr-h .grow { flex: 1; min-width: 0; }
  .dr-b { flex: 1; overflow-y: auto; padding: 20px; }
  .dr-sec { margin-top: 24px; }
  .dr-sec > h3 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--ink); }
  .stepper { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; padding: 3px; background: var(--side); border: 1px solid var(--line); border-radius: 8px; }
  .stepper button { min-height: 32px; padding: 0 4px; border: 0; border-radius: 6px; background: none; cursor: pointer; font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
  .stepper button:hover { background: var(--hover); color: var(--ink); }
  .stepper button[aria-pressed="true"] { background: var(--bg); color: var(--ink); box-shadow: 0 1px 2px rgba(20, 26, 34, .12), 0 0 0 1px var(--line); }
  .quick { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .facts { display: grid; grid-template-columns: 120px 1fr; gap: 10px 12px; margin: 0; font-size: 14px; }
  .facts dt { color: var(--ink-2); }
  .facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .msg { margin: 0; padding: 12px 14px; background: var(--side); border: 1px solid var(--line-soft); border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .money { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .money .field { margin-top: 0; }
  .money .wrap { position: relative; }
  .money .wrap span { position: absolute; left: 11px; top: 9px; color: var(--ink-3); }
  .money .wrap .input { padding-left: 24px; font-variant-numeric: tabular-nums; }
  .notes { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
  .notes li { padding: 10px 12px; border: 1px solid var(--line-soft); border-radius: 8px; }
  .notes li p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .notes li small { color: var(--ink-3); font-size: 12px; }
  .timeline { list-style: none; margin: 0; padding: 0 0 0 4px; }
  .timeline li { position: relative; padding: 0 0 12px 18px; font-size: 13px; color: var(--ink-2); }
  .timeline li::before { content: ""; position: absolute; left: 0; top: 6px; width: 7px; height: 7px; border-radius: 50%; background: #c3c9d0; }
  .timeline li::after { content: ""; position: absolute; left: 3px; top: 16px; bottom: -2px; width: 1px; background: var(--line); }
  .timeline li:last-child::after { display: none; }
  .timeline time { color: var(--ink-3); margin-left: 6px; }
  .dr-f { display: flex; gap: 8px; justify-content: space-between; padding: 14px 20px; border-top: 1px solid var(--line); background: var(--panel); }

  /* ---- modal ---- */
  .modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(20, 26, 34, .28); }
  .modal[hidden] { display: none; }
  .modal .box { width: min(520px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; background: var(--bg); border-radius: 12px; box-shadow: var(--shadow-pop); }
  .modal .box-h { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 0; }
  .modal .box-h h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .modal .box-b { padding: 16px 20px 4px; }
  .modal .box-f { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 20px 20px; }

  /* ---- form & code ---- */
  .fc { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 440px); gap: 20px; align-items: start; }
  .fc .sticky { position: sticky; top: 20px; }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .sw { width: 28px; height: 28px; border-radius: 50%; border: 0; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
  .sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }
  .hex { width: 110px; font-family: var(--mono); font-size: 13px; }
  .preview { padding: 24px; background: repeating-linear-gradient(45deg, #f7f8fa, #f7f8fa 10px, #f3f4f7 10px, #f3f4f7 20px); border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
  .install { margin-top: 20px; }
  .steps3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 18px; }
  .steps3 div { font-size: 13.5px; color: var(--ink-2); }
  .steps3 b { display: block; color: var(--ink); font-weight: 500; margin-bottom: 2px; }
  .code-wrap { position: relative; }
  .code-wrap .btn { position: absolute; top: 8px; right: 8px; background: var(--bg); }
  .plat { margin-top: 18px; }
  .plat .tabs { gap: 22px; }
  .plat-b { padding: 16px 0 0; color: var(--ink-2); }
  .plat-b ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
  .linkbox { display: flex; gap: 8px; }
  .linkbox .input { font-family: var(--mono); font-size: 13px; background: var(--side); }
  .state { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
  .state i { width: 8px; height: 8px; border-radius: 50%; background: #c3c9d0; }
  .state.on i { background: #2f9e57; box-shadow: 0 0 0 3px #dff2e5; }
  @media (max-width: 1180px) { .fc { grid-template-columns: 1fr; } .fc .sticky { position: static; } .steps3 { grid-template-columns: 1fr; } }

  /* ---- settings ---- */
  .set { max-width: 720px; }
  .set .card + .card { margin-top: 16px; }
  .set .card-f { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line-soft); background: var(--panel); border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
  .set .card-h p { margin: 2px 0 0; color: var(--ink-2); font-size: 13px; }
  .keyline { display: flex; gap: 8px; align-items: center; }
  .keyline code { flex: 1; padding: 8px 11px; background: var(--side); border: 1px solid var(--line); border-radius: var(--radius); font: 13px var(--mono); overflow-wrap: anywhere; }
  .danger { border-color: #f0d2cc; }

  /* ---- tasks ---- */
  .addbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 20px 0 6px; }
  .addbar .input, .addbar .select { width: auto; }
  .addbar .grow { flex: 1; min-width: 220px; }
  .tl { list-style: none; margin: 0; padding: 0; }
  .tl li { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--line-soft); }
  .tl li:hover { background: #fafbfc; }
  .chk { width: 20px; height: 20px; flex: none; border-radius: 50%; border: 1.5px solid #b9bfc7; background: #fff; cursor: pointer; display: grid; place-items: center; padding: 0; }
  .chk:hover { border-color: var(--ink); }
  .chk svg { width: 11px; height: 11px; color: #fff; display: none; }
  .tl li.done .chk { background: var(--primary); border-color: var(--primary); }
  .tl li.done .chk svg { display: block; }
  .tl .tt { flex: 1; min-width: 0; }
  .tl .tt b { font-weight: 500; display: block; }
  .tl li.done .tt b { color: var(--ink-3); text-decoration: line-through; }
  .tl .tt small { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--side); border: 1px solid var(--line); font-size: 12.5px; color: var(--ink-2); text-decoration: none; white-space: nowrap; }
  a.chip:hover { color: var(--ink); border-color: #cdd2d8; }
  .due { font-size: 13px; color: var(--ink-2); }
  .due.late { color: var(--danger); font-weight: 500; }
  .due.today { color: var(--ink); font-weight: 500; }
  .tl .x { width: 30px; height: 30px; border: 0; border-radius: 6px; background: none; color: var(--ink-3); cursor: pointer; opacity: 0; display: grid; place-items: center; }
  .tl li:hover .x, .tl .x:focus-visible { opacity: 1; }
  .tl .x:hover { background: var(--active); color: var(--ink); }
  .tl .x svg { width: 16px; height: 16px; }
  @media (hover: none) { .tl .x { opacity: 1; } }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .presets button[aria-pressed="true"] { background: var(--active); border-color: #cdd2d8; }

  /* ---- files ---- */
  .fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; padding-top: 22px; }
  .fcard { display: block; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; text-decoration: none; background: #fff; }
  .fcard:hover { border-color: #cdd2d8; }
  .fthumb { aspect-ratio: 4 / 3; background: var(--side); display: grid; place-items: center; color: var(--ink-3); overflow: hidden; }
  .fthumb img { width: 100%; height: 100%; object-fit: cover; }
  .fthumb svg { width: 28px; height: 28px; }
  .fmeta { padding: 10px 12px; }
  .fmeta b { display: block; font-weight: 500; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fmeta small { color: var(--ink-2); font-size: 12.5px; }
  .dthumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .dthumb { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: var(--side); display: grid; place-items: center; text-decoration: none; color: var(--ink-2); font-size: 11.5px; text-align: center; padding: 0; }
  .dthumb img { width: 100%; height: 100%; object-fit: cover; }
  .dthumb .nm { padding: 6px; overflow-wrap: anywhere; line-height: 1.3; }
  .dthumb .rm { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border: 0; border-radius: 50%; background: rgba(20, 26, 34, .7); color: #fff; cursor: pointer; display: grid; place-items: center; opacity: 0; padding: 0; }
  .dthumb:hover .rm, .dthumb .rm:focus-visible { opacity: 1; }
  .dthumb .rm svg { width: 12px; height: 12px; }
  .dthumb.add { border-style: dashed; cursor: pointer; font-size: 12.5px; color: var(--ink-2); }
  .dthumb.add:hover { background: var(--hover); }
  .storage { font-size: 12.5px; color: var(--ink-3); }

  /* ---- estimates ---- */
  .pill.s-draft, .pill.s-expired, .pill.s-declined { background: var(--st-lost-bg); color: var(--st-lost); }
  .pill.s-sent { background: var(--st-new-bg); color: var(--st-new); }
  .pill.s-viewed { background: var(--st-contacted-bg); color: var(--st-contacted); }
  .pill.s-accepted { background: var(--st-won-bg); color: var(--st-won); }
  .ee { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; padding-top: 24px; }
  .ee .sticky { position: sticky; top: 20px; }
  .items { width: 100%; border-collapse: collapse; }
  .items th { text-align: left; font-weight: 500; font-size: 12.5px; color: var(--ink-2); padding: 0 6px 8px; }
  .items td { padding: 4px 6px; vertical-align: top; }
  .items .input { min-height: 36px; }
  .items .q { width: 80px; } .items .p { width: 120px; } .items .a { width: 110px; text-align: right; padding-top: 12px; font-variant-numeric: tabular-nums; } .items .r { width: 36px; }
  .items .rmrow { width: 32px; height: 36px; border: 0; background: none; color: var(--ink-3); cursor: pointer; border-radius: 6px; display: grid; place-items: center; }
  .items .rmrow:hover { background: var(--active); color: var(--ink); }
  .items .rmrow svg { width: 16px; height: 16px; }
  .esum div { display: flex; justify-content: space-between; padding: 5px 0; font-variant-numeric: tabular-nums; }
  .esum .tot { margin-top: 6px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 20px; font-weight: 700; }
  .eacts { display: grid; gap: 8px; }
  .eacts .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ebanner { margin-bottom: 16px; padding: 12px 14px; border-radius: 8px; font-size: 14px; }
  .ebanner.ok { background: var(--st-won-bg); color: var(--st-won); }
  .ebanner.no { background: var(--st-lost-bg); color: var(--ink-2); }
  .eflow { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 13px; color: var(--ink-2); }
  .eflow li { display: flex; justify-content: space-between; gap: 8px; }
  .eflow li.on { color: var(--ink); }
  @media (max-width: 1100px) { .ee { grid-template-columns: 1fr; } .ee .sticky { position: static; } }
  @media (max-width: 640px) { .items .q { width: 56px; } .items .p { width: 90px; } .items .a { display: none; } }

  /* ---- notifications ---- */
  .nl { list-style: none; margin: 0; padding: 0; }
  .nl li a { display: flex; align-items: flex-start; gap: 14px; padding: 14px 4px; border-bottom: 1px solid var(--line-soft); text-decoration: none; }
  .nl li a:hover { background: #fafbfc; }
  .nl .ni { width: 32px; height: 32px; flex: none; border-radius: 50%; background: var(--side); border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink-2); }
  .nl .ni svg { width: 16px; height: 16px; }
  .nl .nt { flex: 1; min-width: 0; }
  .nl .nt b { font-weight: 500; }
  .nl .nt small { display: block; color: var(--ink-2); font-size: 13px; }
  .nl .when { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
  .nl li.unread .nt b::after { content: ""; display: inline-block; width: 7px; height: 7px; margin-left: 8px; border-radius: 50%; background: var(--focus); vertical-align: middle; }
  .nl-day { margin: 22px 4px 4px; font-size: 13px; font-weight: 500; color: var(--ink-2); }

  .check { display: flex; align-items: flex-start; gap: 10px; margin-top: 16px; font-size: 14px; cursor: pointer; }
  .check input { width: 16px; height: 16px; margin: 2px 0 0; accent-color: var(--primary); }
  .check small { display: block; color: var(--ink-2); font-size: 13px; }
  .grid2b { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  @media (max-width: 1180px) { .grid2b { grid-template-columns: 1fr; } }

  /* ---- loading ---- */
  .loading { display: grid; place-items: center; height: 60vh; color: var(--ink-3); }
  .spin { width: 22px; height: 22px; border: 2px solid var(--line); border-top-color: var(--ink-2); border-radius: 50%; animation: sp .7s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* ---- phones ---- */
  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; }
    .side { position: fixed; inset: 0 auto 0 0; width: 280px; z-index: 45; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow-pop); }
    .shell.nav-open .side { transform: none; }
    .shell.nav-open::after { content: ""; position: fixed; inset: 0; z-index: 44; background: rgba(20,26,34,.2); }
    .menu-btn { display: inline-flex; }
    .top { padding: 12px 16px; min-height: 60px; flex-wrap: wrap; }
    .top .actions { flex-wrap: wrap; }
    .search input { width: 160px; }
    .page { padding: 0 16px 40px; }
    .tiles { grid-template-columns: 1fr 1fr; gap: 10px; }
    .tbl .c-val, .tbl .c-date { display: none; }
    .tbl .who { min-width: 0; }
    .tbl th, .tbl td { padding-left: 6px; padding-right: 6px; }
    .search { flex: 1; } .search input { width: 100%; }
    .top .sepv, .hide-sm { display: none; }
  }
</style>

    var prev = L.filter(function (l) { var a = now - new Date(l.createdAt); return a >= 7 * D && a < 14 * D; }).length;
    var open = L.filter(function (l) { return OPEN[l.status]; });
    var pipe = open.reduce(function (s, l) { return s + (Number(l.estValue) || 0); }, 0);
    var won = L.filter(function (l) { return l.status === 'won'; });
    var wonSum = won.reduce(function (s, l) { return s + (Number(l.wonAmount || l.estValue) || 0); }, 0);
    var lost = L.filter(function (l) { return l.status === 'lost'; }).length;
    var rate = won.length + lost ? Math.round(won.length / (won.length + lost) * 100) + '%' : '-';

        '</div></section>' +

          }).join('') + '</ul>' : '<div class="card-b" style="color:var(--ink-2)">Leads show up here as soon as someone sends your form.</div>') +

  document.addEventListener('click', function (e) {

  // ----------------------------------------------------------------- dates, files, estimates helpers
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function isoDay(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function today() { return isoDay(new Date()); }
  function inDays(n) { var d = new Date(); d.setDate(d.getDate() + n); return isoDay(d); }
  function nextMonday() { var d = new Date(); d.setDate(d.getDate() + ((8 - d.getDay()) % 7 || 7)); return isoDay(d); }
  function fmtDay(s) { return new Date(s + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); }
  function fmtClock(t) { if (!t) return ''; var p = t.split(':'), h = +p[0]; return (h % 12 || 12) + ':' + p[1] + (h < 12 ? ' AM' : ' PM'); }
  function dueInfo(t) {
    if (!t.due) return { text: 'No date', cls: '' };
    var td = today(), clock = t.time ? ' at ' + fmtClock(t.time) : '';
    if (!t.done && t.due < td) return { text: 'Overdue, ' + fmtDay(t.due), cls: 'late' };
    if (t.due === td) return { text: 'Today' + clock, cls: t.done ? '' : 'today' };
    if (t.due === inDays(1)) return { text: 'Tomorrow' + clock, cls: '' };
    return { text: fmtDay(t.due) + clock, cls: '' };
  }
  function dueNow() { var td = today(); return S.tasks.filter(function (t) { return !t.done && t.due && t.due <= td; }); }
  function fileUrl(leadId, f, dl) { return f.demoSrc || '/api/app/files/' + encodeURIComponent(leadId) + '/' + encodeURIComponent(f.id) + (dl ? '?download' : ''); }
  function isImg(f) { return /^image\//.test(f.type || ''); }
  function size(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }
  var EST_NAME = { draft: 'Draft', sent: 'Sent', viewed: 'Viewed', accepted: 'Accepted', declined: 'Declined', expired: 'Expired' };
  function estStatus(e) { return e.status !== 'accepted' && e.status !== 'declined' && e.validUntil && e.validUntil < today() ? 'expired' : e.status; }
  function estPill(e) { var s = estStatus(e); return '<span class="pill s-' + s + '">' + EST_NAME[s] + '</span>'; }
  function estUrl(e) { return location.origin + '/e/?t=' + encodeURIComponent(e.token || ''); }
  function usd(n) { return '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

      method: 'POST', credentials: 'same-origin', body: file,

  function sync(quiet) {
    lastSync = Date.now();
    return Promise.all([api('GET', '/auth/me'), api('GET', '/app/leads'), api('GET', '/app/tasks'), api('GET', '/app/estimates')]).then(function (res) {
      var before = S.leads.map(function (l) { return l.id; });
      var seenBefore = S.account && S.account.formSeenAt;
      S.account = res[0].account; S.leads = res[1].leads; S.tasks = res[2].tasks; S.estimates = res[3].estimates;
      var fresh = S.leads.filter(function (l) { return before.indexOf(l.id) < 0; });
      paintChrome();
      var busy = !$('drawer').hidden || !$('modal').hidden;
      if (fresh.length || (!seenBefore && S.account.formSeenAt)) {
        if (S.route === 'leads' && !busy) { paintTabs(); paintLeadBody(); }
        else if (S.route === 'overview' && !busy) viewOverview();
        else if (S.route === 'form' && !busy && !S.formDirty) viewForm();
        else if ((S.route === 'notifications' || S.route === 'files') && !busy) route();
      }
      if (fresh.length && !quiet) toast(fresh.length === 1 ? 'New lead: ' + fresh[0].name : fresh.length + ' new leads');
    }).catch(function () {});
  }

    var p = DEMO ? Demo.boot() : Promise.all([api('GET', '/auth/me'), api('GET', '/app/leads'), api('GET', '/app/tasks'), api('GET', '/app/estimates')]).then(function (res) {
      S.account = res[0].account; S.leads = res[1].leads; S.tasks = res[2].tasks; S.estimates = res[3].estimates;

      if (DEMO && window.top === window.self) $('demoBar').hidden = false;
      if (!location.hash) history.replaceState(null, '', S.leads.length ? '#/leads' : '#/form');
      route();
      if (!DEMO) {
        setInterval(function () { if (!document.hidden) sync(false); }, 30000);
        document.addEventListener('visibilitychange', function () { if (!document.hidden && Date.now() - lastSync > 8000) sync(false); });
      }
    }).catch(function (e) {
      $('scroll').innerHTML = '<div class="empty"><h3>Could not load your dashboard</h3><p>' + esc(e.message) + '</p><button class="btn" onclick="location.reload()">Try again</button></div>';
