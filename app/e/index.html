<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Estimate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/ui.css">
<style>
  body { background: var(--side); }
  .wrap { max-width: 820px; margin: 0 auto; padding: 32px 16px 64px; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .bar .state { font-size: 14px; color: var(--ink-2); }
  .doc { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 40px 44px; }
  .doc-h { display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
  .doc-h h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  .doc-h .biz p { margin: 4px 0 0; color: var(--ink-2); white-space: pre-line; font-size: 14px; }
  .doc-h .meta { text-align: right; }
  .doc-h .meta .k { font-size: 12px; color: var(--ink-3); }
  .doc-h .meta .no { font-size: 18px; font-weight: 600; }
  .doc-h .meta dl { margin: 10px 0 0; display: grid; grid-template-columns: auto auto; gap: 2px 14px; font-size: 13.5px; }
  .doc-h .meta dt { color: var(--ink-2); text-align: right; }
  .doc-h .meta dd { margin: 0; text-align: right; }
  .for { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 24px 0; }
  .for h2 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--ink-3); }
  .for p { margin: 0; white-space: pre-line; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12.5px; font-weight: 500; color: var(--ink-2); padding: 10px 0; border-bottom: 1px solid var(--line); }
  td { padding: 12px 0; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
  .n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 16px; }
  .sum { margin-left: auto; width: min(320px, 100%); margin-top: 16px; }
  .sum div { display: flex; justify-content: space-between; padding: 6px 0; font-variant-numeric: tabular-nums; }
  .sum .tot { margin-top: 6px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 18px; font-weight: 700; }
  .notes { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); }
  .notes h2 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--ink-3); }
  .notes p { margin: 0; white-space: pre-line; color: #3a424d; }
  .act { margin-top: 20px; padding: 24px; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
  .act h2 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
  .act p.s { margin: 0 0 16px; color: var(--ink-2); }
  .act .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .act .row .field { flex: 1; min-width: 220px; }
  .banner { margin-bottom: 16px; padding: 14px 16px; border-radius: 10px; border: 1px solid; font-weight: 500; }
  .banner.ok { background: var(--st-won-bg); border-color: #bfe3c9; color: var(--st-won); }
  .banner.no { background: var(--st-lost-bg); border-color: var(--line); color: var(--ink-2); }
  .decline { margin-top: 14px; }
  .decline summary { cursor: pointer; color: var(--ink-2); font-size: 14px; }
  .foot { margin-top: 24px; text-align: center; font-size: 12.5px; color: var(--ink-3); }
  .foot a { color: var(--ink-2); }
  .msg { max-width: 460px; margin: 80px auto; text-align: center; }
  .msg h1 { font-size: 20px; margin: 0 0 6px; }
  .msg p { color: var(--ink-2); }
  @media (max-width: 640px) { .doc { padding: 24px 18px; } .for { grid-template-columns: 1fr; } .doc-h .meta { text-align: left; } .doc-h .meta dt, .doc-h .meta dd { text-align: left; } }
  @media print {
    body { background: #fff; }
    .wrap { padding: 0; max-width: none; }
    .bar, .act, .foot, .no-print { display: none !important; }
    .doc { border: 0; padding: 0; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg"><div class="spin" style="margin:0 auto;width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--ink-2);border-radius:50%"></div></div></div>
<script>
(function () {
  var token = new URLSearchParams(location.search).get('t') || '';
  var app = document.getElementById('app');
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var usd = function (n) { return '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var day = function (s) { if (!s) return ''; var d = /^\d{4}-\d{2}-\d{2}$/.test(s) ? new Date(s + 'T12:00:00') : new Date(s); return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }); };
  var data;

  function fail(msg) { app.innerHTML = '<div class="msg"><h1>Estimate not available</h1><p>' + esc(msg) + '</p></div>'; }

  function load() {
    fetch('/api/estimate/' + encodeURIComponent(token), { credentials: 'same-origin' }).then(function (r) {
      return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'This link does not work.'); return j; });
    }).then(function (j) { data = j; paint(); }).catch(function (e) { fail(e.message); });
  }

  function paint() {
    var b = data.business, e = data.estimate;
    document.title = 'Estimate ' + e.number + ' from ' + b.name;
    var expired = e.validUntil && new Date(e.validUntil + 'T23:59:59') < new Date();
    var open = e.status !== 'accepted' && e.status !== 'declined' && !expired;
    var contact = [b.phone, b.email].filter(Boolean).join('\n');
    app.innerHTML =
      '<div class="bar"><span class="state">Estimate from ' + esc(b.name) + '</span><button class="btn" id="print">Download PDF</button></div>' +
      (e.status === 'accepted' ? '<div class="banner ok" role="status">Accepted by ' + esc(e.acceptedName) + ' on ' + esc(day(e.acceptedAt)) + '. ' + esc(b.name) + ' will contact you to schedule the work.</div>' : '') +
      (e.status === 'declined' ? '<div class="banner no" role="status">This estimate was declined on ' + esc(day(e.declinedAt)) + '.</div>' : '') +
      (expired && e.status !== 'accepted' && e.status !== 'declined' ? '<div class="banner no" role="status">This estimate expired on ' + esc(day(e.validUntil)) + '. Ask ' + esc(b.name) + ' for an updated one.</div>' : '') +
      '<article class="doc">' +
        '<header class="doc-h"><div class="biz"><h1>' + esc(b.name) + '</h1>' +
          (b.address ? '<p>' + esc(b.address) + '</p>' : '') + (contact ? '<p>' + esc(contact) + '</p>' : '') + (b.license ? '<p>License ' + esc(b.license) + '</p>' : '') + '</div>' +
          '<div class="meta"><div class="k">Estimate</div><div class="no">' + esc(e.number) + '</div><dl>' +
            '<dt>Date</dt><dd>' + esc(day(e.createdAt)) + '</dd>' + (e.validUntil ? '<dt>Valid until</dt><dd>' + esc(day(e.validUntil)) + '</dd>' : '') +
          '</dl></div></header>' +
        '<section class="for"><div><h2>Prepared for</h2><p>' + esc([e.customer.name, e.customer.address, e.customer.phone, e.customer.email].filter(Boolean).join('\n')) + '</p></div>' +
          (e.title ? '<div><h2>Project</h2><p>' + esc(e.title) + '</p></div>' : '') + '</section>' +
        '<table><thead><tr><th>Description</th><th class="n">Qty</th><th class="n">Price</th><th class="n">Amount</th></tr></thead><tbody>' +
          e.items.map(function (it) { var a = (Number(it.qty) || 0) * (Number(it.price) || 0); return '<tr><td>' + esc(it.desc) + '</td><td class="n">' + esc(it.qty) + '</td><td class="n">' + usd(it.price) + '</td><td class="n">' + usd(a) + '</td></tr>'; }).join('') +
        '</tbody></table>' +
        '<div class="sum"><div><span>Subtotal</span><span>' + usd(e.subtotal) + '</span></div>' +
          (Number(e.rate) ? '<div><span>Tax (' + esc(e.rate) + '%)</span><span>' + usd(e.tax) + '</span></div>' : '') +
          '<div class="tot"><span>Total</span><span>' + usd(e.total) + '</span></div></div>' +
        (e.notes ? '<section class="notes"><h2>Notes and terms</h2><p>' + esc(e.notes) + '</p></section>' : '') +
        (e.status === 'accepted' ? '<section class="notes"><h2>Accepted</h2><p>' + esc(e.acceptedName) + ', ' + esc(new Date(e.acceptedAt).toLocaleString('en-US')) + '</p></section>' : '') +
      '</article>' +
      (open ? '<section class="act" aria-labelledby="accH"><h2 id="accH">Ready to go ahead?</h2><p class="s">Type your full name to accept this estimate. ' + esc(b.name) + ' gets a notice right away.</p>' +
        '<form id="acc" class="row" novalidate><label class="field"><span class="label">Your full name</span><input class="input" id="nm" autocomplete="name" value="' + esc(e.customer.name) + '"></label>' +
        '<button class="btn btn-primary" id="accBtn" type="submit" style="min-height:38px">Accept estimate for ' + usd(e.total) + '</button></form>' +
        '<p class="err" id="err" role="alert" style="margin-top:8px"></p>' +
        '<details class="decline"><summary>Not going ahead?</summary><form id="dec" style="margin-top:12px" novalidate><label class="field"><span class="label">Tell them why <span class="opt">(optional)</span></span><textarea class="textarea" id="why" rows="2"></textarea></label><button class="btn" style="margin-top:10px" type="submit">Decline estimate</button></form></details>' +
      '</section>' : '') +
      '<p class="foot">Sent with <a href="/">Lead Desk</a></p>';

    document.getElementById('print').onclick = function () { window.print(); };
    if (!open) return;
    document.getElementById('acc').onsubmit = function (ev) {
      ev.preventDefault();
      var name = document.getElementById('nm').value.trim();
      if (name.length < 2) { document.getElementById('err').textContent = 'Type your full name to accept.'; return document.getElementById('nm').focus(); }
      send('accept', { name: name }, document.getElementById('accBtn'));
    };
    document.getElementById('dec').onsubmit = function (ev) {
      ev.preventDefault();
      send('decline', { reason: document.getElementById('why').value.trim() }, ev.target.querySelector('button'));
    };
  }

  function send(action, body, btn) {
    btn.disabled = true;
    fetch('/api/estimate/' + encodeURIComponent(token) + '/' + action, {
      method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Something went wrong.'); return j; }); })
      .then(function (j) { data = j; paint(); window.scrollTo(0, 0); })
      .catch(function (e) { btn.disabled = false; var el = document.getElementById('err'); if (el) el.textContent = e.message; });
  }

  if (!/^[\w-]{20,40}$/.test(token)) fail('This link is missing part of its address. Ask the business to send it again.'); else load();
})();
</script>
</body>
</html>
