<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request an estimate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/ui.css">
<style>
  body { background: var(--side); min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: 28px 16px 8px; text-align: center; }
  header h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
  header p { margin: 6px 0 0; color: var(--ink-2); }
  main { flex: 1; padding: 16px 16px 40px; }
  footer { padding: 16px; text-align: center; font-size: 12.5px; color: var(--ink-3); }
  footer a { color: var(--ink-2); }
  .missing { max-width: 420px; margin: 40px auto; text-align: center; color: var(--ink-2); }
</style>
</head>
<body>
<header><h1 id="biz">&nbsp;</h1><p id="tel"></p></header>
<main><div id="leaddesk"></div></main>
<footer>Form by <a href="/">Lead Desk</a></footer>
<script>
(function () {
  var key = new URLSearchParams(location.search).get('k') || '';
  var biz = document.getElementById('biz');
  if (!/^ld_[\w-]{10,40}$/.test(key)) { biz.textContent = 'Form not found'; document.getElementById('leaddesk').innerHTML = '<p class="missing">This link is missing its form key. Ask the business for their form link again.</p>'; return; }
  fetch('/api/form/' + encodeURIComponent(key)).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
    if (!j) { biz.textContent = 'Form not found'; document.getElementById('leaddesk').innerHTML = '<p class="missing">This form is no longer active.</p>'; return; }
    biz.textContent = j.form.business; document.title = 'Request an estimate - ' + j.form.business;
    if (j.form.phone) { var t = document.getElementById('tel'); t.innerHTML = 'Prefer to talk? Call <a href="tel:' + j.form.phone.replace(/[^\d+]/g, '') + '"></a>'; t.querySelector('a').textContent = j.form.phone; }
    var s = document.createElement('script');
    s.src = '/leaddesk.js'; s.setAttribute('data-key', key); s.defer = true;
    document.body.appendChild(s);
  }).catch(function () { biz.textContent = 'Could not load the form'; });
})();
</script>
</body>
</html>
